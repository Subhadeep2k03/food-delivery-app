<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
       <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Oops</title>
</head>
<body>
    <h2 th:if="${status == 404}">Page not found</h2>
    <h2 th:if="${status == 400}">That request was not valid</h2>
    <h2 th:unless="${status == 404 or status == 400}">Something went wrong</h2>

    <p th:if="${status == 404}">The page you are looking for does not exist.</p>
    <p th:if="${status == 400}">Please go back and check what you entered.</p>
    <p th:unless="${status == 404 or status == 400}">Please try again in a moment.</p>

    <a th:href="@{/home}">Go to home</a> | <a th:href="@{/login}">Login</a>
</body>
</html>
