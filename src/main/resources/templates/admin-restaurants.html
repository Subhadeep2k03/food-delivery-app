<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Restaurants</title>
</head>
<body>
    <h2>Admin: Restaurants</h2>
        <a th:href="@{/home}">Home</a> | <a th:href="@{/admin/orders}">All Orders</a> | <a th:href="@{/logout}">Logout</a>
    <hr>
    <h3>Add restaurant</h3>
    <form th:action="@{/admin/restaurants}" method="post">
        <input type="text" name="name" placeholder="Name" required>
        <input type="text" name="cuisine" placeholder="Cuisine" required>
        <input type="text" name="address" placeholder="Address" required>
        <button type="submit">Add</button>
    </form>
    <hr>
    <table border="1" cellpadding="8">
        <tr><th>Name</th><th>Cuisine</th><th>Address</th><th></th></tr>
        <tr th:each="r : ${restaurants}">
            <td th:text="${r.name}"></td>
            <td th:text="${r.cuisine}"></td>
            <td th:text="${r.address}"></td>
            <td><a th:href="@{/admin/restaurants/{id}/items(id=${r.id})}">Manage menu</a></td>
        </tr>
    </table>
</body>
</html>
