<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
    <h2>Register</h2>
    <p style="color:red" th:if="${error}" th:text="${error}"></p>
    <form th:action="@{/register}" method="post">
        <input type="text" name="name" th:value="${name}" placeholder="Name" maxlength="100" required><br><br>
        <input type="email" name="email" th:value="${email}" placeholder="Email" maxlength="150" required><br><br>
        <input type="password" name="password" placeholder="Password (min 6 characters)" minlength="6" maxlength="72" required><br><br>
        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a th:href="@{/login}">Login</a></p>
</body>
</html>
