<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
       <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Login</title>
</head>
<body>
    <h2>Login</h2>
    <p style="color:green" th:if="${param.registered}">Registered successfully. Please login.</p>
    <p style="color:red" th:if="${error}" th:text="${error}"></p>
    <form th:action="@{/login}" method="post">
        <input type="email" name="email" placeholder="Email" required><br><br>
        <input type="password" name="password" placeholder="Password" required><br><br>
        <button type="submit">Login</button>
    </form>
    <p>New user? <a th:href="@{/register}">Register</a></p>
</body>
</html>
